name: release-testflight
on:
  workflow_dispatch:

env:
  BUNDLE_PREFIX: com.horekvpn.app

jobs:
  release:
    # поставь такое же значение runs-on, как в твоём build.yml
    runs-on: macos-15
    steps:
      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.13.21
          path: sing-box

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Libbox
        working-directory: sing-box
        run: |
          make lib_install
          go run ./cmd/internal/build_libbox -target apple -platform ios
          mv Libbox.xcframework ..

      - name: Install certificate and profiles
        env:
          CERT_P12: ${{ secrets.DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.APP_PROFILE_BASE64 }}
          EXT_PROFILE_B64: ${{ secrets.EXT_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          for kind in APP EXT; do
            var="${kind}_PROFILE_B64"
            echo "${!var}" | base64 --decode > "$RUNNER_TEMP/$kind.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/$kind.mobileprovision" > "$RUNNER_TEMP/$kind.plist"
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/$kind.plist")
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/$kind.plist")
            team=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/$kind.plist")
            cp "$RUNNER_TEMP/$kind.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "${kind}_PROFILE_NAME=$name" >> "$GITHUB_ENV"
            echo "TEAM_ID=$team" >> "$GITHUB_ENV"
          done

      - name: Configure project for release
        env:
          VERSION: "1.0.0"
          BUILD: ${{ github.run_number }}
        run: |
          APP_PROFILE="$APP_PROFILE_NAME" EXT_PROFILE="$EXT_PROFILE_NAME" python3 tools/configure_release.py

      - name: Archive
        run: |
          xcodebuild archive -skipPackagePluginValidation \
            -project sing-box.xcodeproj -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Horek.xcarchive"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_PREFIX</key><string>$APP_PROFILE_NAME</string>
              <key>$BUNDLE_PREFIX.extension</key><string>$EXT_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Horek.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
