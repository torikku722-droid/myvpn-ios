name: build-unsigned
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    env:
      DISABLE_SWIFTLINT: "1"
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.13.21
          path: sing-box
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build Libbox
        working-directory: sing-box
        run: |
          make lib_install
          go run ./cmd/internal/build_libbox -target apple -platform ios
          mv Libbox.xcframework ..
      - name: Build app (no signing)
        run: |
          xcodebuild build -skipPackagePluginValidation \
            -project sing-box.xcodeproj -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO