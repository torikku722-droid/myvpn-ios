name: build-unsigned
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    env:
      DISABLE_SWIFTLINT: "1"
    steps:
      - name: Select newest Xcode
        run: | 
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.13.21
          path: sing-box
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build Libbox
        working-directory: sing-box
        run: |
          make lib_install
          go run ./cmd/internal/build_libbox -target apple -platform ios
          mv Libbox.xcframework ..
      - name: Build app (no signing)
        run: |
          xcodebuild build -skipPackagePluginValidation \
            -project sing-box.xcodeproj -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO